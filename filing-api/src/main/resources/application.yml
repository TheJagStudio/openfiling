spring:
  application:
    name: filing-api
  threads:
    virtual:
      enabled: true
  lifecycle:
    timeout-per-shutdown-phase: 20s
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/openfiling}
    username: ${DB_USER:openfiling}
    password: ${DB_PASSWORD:openfiling}
    hikari:
      pool-name: filing-hikari
      data-source-properties:
        reWriteBatchedInserts: true
        ApplicationName: filing-api
      maximum-pool-size: ${DB_POOL_SIZE:15}
      minimum-idle: 2
      connection-timeout: 5000
      max-lifetime: 1800000
      connection-init-sql: SET search_path TO filing, public
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: filing
        jdbc:
          batch_size: 50
          time_zone: UTC
        order_inserts: true
        order_updates: true
        default_batch_fetch_size: 100
        query:
          fail_on_pagination_over_collection_fetch: true
          in_clause_parameter_padding: true
  flyway:
    schemas: filing
    default-schema: filing
    create-schemas: true
    locations: classpath:db/migration
  mvc:
    problemdetails:
      enabled: true
    format:
      date: iso
      date-time: iso
  jackson:
    default-property-inclusion: always
  security:
    oauth2:
      resourceserver:
        jwt:
          # Tokens are validated with the in-process public key (see JwtConfig).
          jws-algorithms: RS256

server:
  port: ${PORT:8080}
  shutdown: graceful
  error:
    include-stacktrace: never
    include-message: never
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  info:
    env:
      enabled: true
    java:
      enabled: true

info:
  app:
    name: filing-api
    description: OpenFiling patent application intake, document management and examiner workflow

springdoc:
  api-docs:
    path: /v3/api-docs
    version: openapi_3_0
  swagger-ui:
    path: /swagger-ui.html
  default-produces-media-type: application/json
  show-actuator: false

app:
  jwt:
    issuer: openfiling
    access-token-ttl: 15m
    refresh-token-ttl: 7d
    key-dir: ${JWT_KEY_DIR:../data/keys}
  security:
    internal-token: ${INTERNAL_TOKEN:dev-internal-token-change-me}
    max-failed-logins: 5
    lockout-duration: 15m
    auth-rate-limit-per-minute: ${AUTH_RATE_LIMIT_PER_MINUTE:20}
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:4200}
  storage:
    # Blank endpoint = real AWS (regional endpoint, default credentials chain / task role).
    endpoint: ${S3_ENDPOINT:http://localhost:9000}
    # Host used only in pre-signed URLs (must be reachable from the browser); blank = same as endpoint.
    public-endpoint: ${S3_PUBLIC_ENDPOINT:}
    region: ${S3_REGION:us-east-1}
    access-key: ${S3_ACCESS_KEY:openfiling-local}
    secret-key: ${S3_SECRET_KEY:openfiling-local-secret}
    path-style: ${S3_PATH_STYLE:true}
    documents-bucket: ${DOCUMENTS_BUCKET:openfiling-documents}
    public-bucket: ${PUBLIC_BUCKET:openfiling-public-copies}
    upload-url-ttl: 15m
    download-url-ttl: 5m
    max-upload-bytes: 524288000
    max-documents-per-application: 60
    stale-upload-grace: 1h
  redaction:
    invoke-url: ${REDACTION_INVOKE_URL:http://localhost:9001/2015-03-31/functions/openfiling-redaction/invocations}
    health-url: ${REDACTION_HEALTH_URL:http://localhost:9001/health}
    connect-timeout: 2s
    read-timeout: 5s
  scheduling:
    enabled: true
    expiry-sweep-interval: PT10M
  seed:
    enabled: ${SEED_ENABLED:false}

logging:
  pattern:
    level: "%5p [${spring.application.name:},%X{requestId:-}]"
  level:
    org.hibernate.orm.deprecation: error
