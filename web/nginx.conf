# OpenFiling web: static SPA + reverse proxy to filing-api.
# PDFs never pass through here — the browser PUTs them straight to S3 via pre-signed URLs.
upstream filing-api {
  server filing-api:8080;
  keepalive 16;
}

server {
  listen 8080;
  root /usr/share/nginx/html;
  client_max_body_size 2m;

  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options SAMEORIGIN always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  location ~ ^/(api|v3|swagger-ui|webjars|actuator)(/|\.html|$) {
    proxy_pass http://filing-api;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-Id $http_x_request_id;
    proxy_read_timeout 60s;
  }

  location ~* \.(js|css|woff2?|svg|png|ico)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
